group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}
rootProject.allprojects { repositories { google(); mavenCentral() } }

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }
    compileSdkVersion 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig { minSdkVersion 16 }
    dependencies {
        implementation fileTree(dir: "$projectDir/prebuilt", include: "*.jar")
    }
}

task verifyPrebuiltJars {
    doLast {
        ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
            def f = file("$projectDir/prebuilt/default-${abi}.jar")
            if (!f.exists()) throw new GradleException("Missing ${f}")
        }
    }
}
preBuild.dependsOn(verifyPrebuiltJars)
